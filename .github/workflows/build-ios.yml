name: Build & Package Apps (TestFlight & Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Upload directly to TestFlight?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build, Sign & Deploy to TestFlight
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy-ios')) }}

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Select latest Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: 4. Install Node dependencies
        run: |
          npm install

      - name: 5. Prebuild Native iOS Project with Expo
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios

      - name: 6. Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 7. Configure Keychain & Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Setting up isolated CI keychain..."
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Decoding and importing Apple Distribution Certificate..."
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Installing App Store Distribution Provisioning Profile..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(python3 -c "import plistlib, re; f=open('AStarSwim_AppStore.mobileprovision','rb').read(); m=re.search(rb'<\?xml.*?</plist>', f, re.DOTALL); print(plistlib.loads(m.group(0))['UUID'])")
          echo "Installing profile with UUID: $UUID"
          cp AStarSwim_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

          echo "Verifying code signing identity..."
          security find-identity -v -p codesigning

      - name: 8. Build Signed Xcode Archive
        run: |
          cd ios
          mkdir -p build
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | jq -r '.workspace.schemes[0]')
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: 9. Export Signed Production IPA
        run: |
          cd ios
          mkdir -p build/Export
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ../exportOptions.plist

          SIGNED_IPA=$(find build/Export -name "*.ipa" | head -n 1)
          if [ -n "$SIGNED_IPA" ]; then
            echo "Production signed IPA created: $SIGNED_IPA"
            cp "$SIGNED_IPA" ../AStarSwimSchools-v1.0.8-Production.ipa
            ls -lh ../AStarSwimSchools-v1.0.8-Production.ipa
          else
            echo "Error: Signed IPA was not produced by xcodebuild."
            exit 1
          fi

      - name: 10. Upload Signed IPA Artifact to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-v1.0.8-Signed-Production-IPA
          path: AStarSwimSchools-v1.0.8-Production.ipa
          retention-days: 30

      - name: 11. Deploy Signed App to TestFlight via altool
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "Setting up App Store Connect API credentials for xcrun altool..."
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          echo "Uploading signed IPA to Apple TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file AStarSwimSchools-v1.0.8-Production.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

          echo "🚀 Successfully uploaded to Apple TestFlight!"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Node dependencies
        run: |
          npm install

      - name: 5. Prebuild Native Android Project with Expo
        run: |
          npx expo prebuild --platform android --clean
          ls -la android

      - name: 6. Build Standalone Release APK & Google Play AAB
        run: |
          cd android
          chmod +x gradlew
          
          # Ensure release buildType uses signingConfigs.debug so the standalone APK installs directly on physical devices
          python3 -c "
          p = 'app/build.gradle'
          with open(p, 'r') as f:
              content = f.read()
          if 'signingConfig signingConfigs.debug' not in content:
              content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
          elif 'signingConfig signingConfigs.release' in content:
              content = content.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug')
          with open(p, 'w') as f:
              f.write(content)
          "

          # Build Release APK (offline standalone with bundled JS) and Release AAB (Google Play bundle)
          ./gradlew assembleRelease bundleRelease --no-daemon

          mkdir -p ../dist-apk ../dist-aab

          # Copy Release APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Standalone Release APK: $APK_FILE"
          cp "$APK_FILE" ../dist-apk/AStarSwimSchools-v1.0.8-Preview.apk

          # Copy Release AAB
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "Found Google Play AAB: $AAB_FILE"
            cp "$AAB_FILE" ../dist-aab/AStarSwimSchools-v1.0.8-PlayStore.aab
          fi

          ls -lh ../dist-apk
          ls -lh ../dist-aab || true

      - name: 7. Verify Offline JS Bundle inside Standalone APK
        run: |
          echo "Verifying index.android.bundle inside standalone APK..."
          unzip -l dist-apk/AStarSwimSchools-v1.0.8-Preview.apk | grep -E "index\.android\.bundle|hermes" || (echo "ERROR: index.android.bundle is missing from APK!" && exit 1)
          echo "SUCCESS: Standalone APK contains offline JS bundle and is 100% verified!"

      - name: 8. Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-v1.0.8-Android-Binaries
          path: |
            dist-apk/AStarSwimSchools-v1.0.8-Preview.apk
            dist-aab/*.aab
          retention-days: 30
