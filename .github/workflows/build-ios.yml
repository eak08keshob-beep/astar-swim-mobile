name: Build & Package iOS App & Deploy to TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Upload directly to TestFlight?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build & Deploy iOS App to TestFlight
    runs-on: macos-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Select latest Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: 4. Install Node dependencies
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          npm install

      - name: 5. Sync Capacitor iOS
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          npx cap sync ios

      - name: 6. Install CocoaPods
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          cd ios/App
          pod install --repo-update

      - name: 7. Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "App Store Connect API Key configured successfully."
          else
            echo "Notice: APP_STORE_CONNECT_PRIVATE_KEY secret is empty."
          fi

      - name: 8. Build, Sign & Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Running Fastlane for automatic certificate creation, code signing, and TestFlight upload..."
            fastlane ios beta
          else
            echo "Notice: APP_STORE_CONNECT_PRIVATE_KEY is missing. Building ad-hoc unsigned archive..."
            cd ios/App
            mkdir -p build
            xcodebuild archive               -workspace App.xcworkspace               -scheme App               -destination "generic/platform=iOS"               -archivePath build/App.xcarchive               CODE_SIGNING_ALLOWED=NO               CODE_SIGN_IDENTITY=""               CODE_SIGNING_REQUIRED=NO
          fi

      - name: 9. Fallback Packaging into IPA (If Not Yet Created)
        if: ${{ always() }}
        run: |
          if [ ! -f "build/AStarSwimSchools-Production.ipa" ] && [ ! -f "AStarSwimSchools-Production.ipa" ]; then
            echo "Packaging archive into IPA..."
            cd ios/App
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/ 2>/dev/null || true
            zip -r ../../AStarSwimSchools-Production.ipa Payload/ 2>/dev/null || true
          elif [ -f "build/AStarSwimSchools-Production.ipa" ]; then
            cp "build/AStarSwimSchools-Production.ipa" ./AStarSwimSchools-Production.ipa
          fi

      - name: 10. Upload IPA Artifact to GitHub
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-iOS-IPA
          path: '**/AStarSwimSchools-Production.ipa'
          retention-days: 30
