name: Build & Package Apps (TestFlight & Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Upload directly to TestFlight?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build, Sign & Deploy to TestFlight
    runs-on: macos-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Select latest Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: 4. Install Node dependencies
        run: |
          npm install

      - name: 5. Prebuild Native iOS Project with Expo
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios

      - name: 6. Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 7. Configure Keychain & Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Setting up isolated CI keychain..."
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Decoding and importing Apple Distribution Certificate..."
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Installing App Store Distribution Provisioning Profile..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/3eec1108-e221-4fd1-8f11-4bd4cc792bf2.mobileprovision"

          echo "Verifying code signing identity..."
          security find-identity -v -p codesigning

      - name: 8. Build Signed Xcode Archive
        run: |
          cd ios
          mkdir -p build
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | jq -r '.workspace.schemes[0]')
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: 9. Export Signed Production IPA
        run: |
          cd ios
          mkdir -p build/Export
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ../exportOptions.plist

          SIGNED_IPA=$(find build/Export -name "*.ipa" | head -n 1)
          if [ -n "$SIGNED_IPA" ]; then
            echo "Production signed IPA created: $SIGNED_IPA"
            cp "$SIGNED_IPA" ../AStarSwimSchools-Production.ipa
            ls -lh ../AStarSwimSchools-Production.ipa
          else
            echo "Error: Signed IPA was not produced by xcodebuild."
            exit 1
          fi

      - name: 10. Upload Signed IPA Artifact to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-Signed-Production-IPA
          path: AStarSwimSchools-Production.ipa
          retention-days: 30

      - name: 11. Deploy Signed App to TestFlight via altool
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "Setting up App Store Connect API credentials for xcrun altool..."
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          echo "Uploading signed IPA to Apple TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file AStarSwimSchools-Production.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

          echo "🚀 Successfully uploaded to Apple TestFlight!"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Node dependencies
        run: |
          npm install

      - name: 5. Prebuild Native Android Project with Expo
        run: |
          npx expo prebuild --platform android --clean
          ls -la android

      - name: 6. Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist-apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../dist-apk/ \;
          ls -lh ../dist-apk

      - name: 7. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
