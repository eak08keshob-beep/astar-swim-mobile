name: Build & Package iOS App & Deploy to TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Upload directly to TestFlight?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build & Deploy iOS App to TestFlight
    runs-on: macos-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Select latest Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: 4. Install Node dependencies
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          npm install

      - name: 5. Sync Capacitor iOS
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          npx cap sync ios

      - name: 6. Install CocoaPods
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          cd ios/App
          pod install --repo-update

      - name: 7. Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "App Store Connect API Key configured successfully."
          else
            echo "Notice: APP_STORE_CONNECT_PRIVATE_KEY secret is empty."
          fi

      - name: 8. Build Xcode Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          cd ios/App
          mkdir -p build
          
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Building archive with App Store Connect automatic provisioning..."
            xcodebuild archive \
              -workspace App.xcworkspace \
              -scheme App \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          else
            echo "Building ad-hoc unsigned archive..."
            xcodebuild archive \
              -workspace App.xcworkspace \
              -scheme App \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: 9. Export & Upload Directly to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Skipping TestFlight upload: APP_STORE_CONNECT_PRIVATE_KEY secret is not set."
            exit 0
          fi
          
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          cd ios/App
          
          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>DH67Z886MU</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          echo "Signing and uploading directly to TestFlight..."
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            
          echo "TestFlight upload completed successfully!"

      - name: 10. Fallback Packaging into Local .IPA (For Direct PC Download)
        run: |
          if [ -d "mobile-app-package" ]; then cd mobile-app-package; fi
          cd ios/App
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r AStarSwimSchools-Production.ipa Payload/
          mv AStarSwimSchools-Production.ipa ../../

      - name: 11. Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AStarSwimSchools-iOS-IPA
          path: '**/AStarSwimSchools-Production.ipa'
          retention-days: 30
